name: Build IPA (Xcode 15.4)

on:
  workflow_dispatch:
    inputs:
      package_mode:
        description: Build mode
        required: true
        default: unsigned
        type: choice
        options:
          - unsigned
          - signed
      configuration:
        description: Build configuration
        required: true
        default: Release
        type: choice
        options:
          - Release
          - Debug

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Resolve CocoaPods (if Podfile exists)
        run: |
          if [ -f Podfile ]; then
            sudo gem install cocoapods --no-document
            pod install
          else
            echo "No Podfile found in repo root, skip pod install"
          fi

      - name: Import signing certificate
        if: ${{ github.event.inputs.package_mode == 'signed' }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > build_certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import build_certificate.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k build.keychain
          security list-keychains -d user -s build.keychain

      - name: Install provisioning profile
        if: ${{ github.event.inputs.package_mode == 'signed' }}
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/build.mobileprovision

      - name: Archive
        run: |
          set -e
          SIGN_ARGS=""
          if [ "${{ github.event.inputs.package_mode }}" = "unsigned" ]; then
            SIGN_ARGS='CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""'
          fi

          xcodebuild \
            -workspace "CmdCode/CmdCode.xcworkspace" \
            -scheme "CmdCode" \
            -configuration "${{ github.event.inputs.configuration }}" \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            clean archive $SIGN_ARGS

      - name: Export IPA (signed)
        if: ${{ github.event.inputs.package_mode == 'signed' }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "ci/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Package IPA (unsigned)
        if: ${{ github.event.inputs.package_mode == 'unsigned' }}
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/unsigned/Payload"
          cp -R "$RUNNER_TEMP/App.xcarchive/Products/Applications/CmdCode.app" "$RUNNER_TEMP/unsigned/Payload/"
          cd "$RUNNER_TEMP/unsigned"
          /usr/bin/zip -qry CmdCode-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: |
            ${{ runner.temp }}/export/*.ipa
            ${{ runner.temp }}/unsigned/*.ipa
          if-no-files-found: error
