name: Build iOS 12 IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/build-ios12-ipa.yml"
      - "ci/build_unsigned_ios12.sh"
      - "CmdCode_20260317/**"
      - "CmdCode_20260317_fixed.zip"

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Install CocoaPods
        run: |
          if ! command -v pod >/dev/null 2>&1; then
            sudo gem install cocoapods
          fi
          pod --version

      - name: Build Unsigned IPA
        run: bash ci/build_unsigned_ios12.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CmdCode-ios12-unsigned-ipa
          path: build-ci/CmdCode-ios12-unsigned.ipa

      - name: Upload Archive
        uses: actions/upload-artifact@v4
        with:
          name: CmdCode-ios12-xcarchive
          path: build-ci/CmdCode-ios12.xcarchive
